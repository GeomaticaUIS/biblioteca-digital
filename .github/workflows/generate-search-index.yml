name: Generar índice de búsqueda

on:
  push:
    paths:
      - 'catalog/index.json'
      - 'catalog/part*.json'
      - 'generate_search_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-search-index:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generar índice comprimido
        run: python3 generate_search_index.py

      - name: Guardar índice si cambió
        run: |
          if [ -z "$(git status --porcelain -- catalog/search)" ]; then
            echo "El índice no tuvo cambios."
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add catalog/search
          git commit -m "Actualizar índice de búsqueda"
          git push
